name=AutoLink
version=5.3.70
author=Developer
maintainer=Developer
sentence=Auto-negotiating, self-healing UART for ESP32 with stop-and-wait (SYNC) or async-pipeline (ASYNC) send modes, auto-baud lock, and COBS+CRC framing.
paragraph=One-object send()/recv() API. Default mode SYNC: stop-and-wait, one message in flight, sender blocks for the receiver ACK before sending the next. No ARQ pool, no reorder buffer, no heap allocation on the hot path — works on any wire that carries COBS+CRC frames. Mode ASYNC: many in flight, NAK-driven retransmits up to a bounded retry budget, cobsSeq gap detection with a bounded reorder buffer; a chunk that exhausts its retries is dropped (counted in lostMsgs), not delivered. Switch modes at runtime with comm.setMode(AutoLinkConfig::Mode::SYNC/ASYNC). The link auto-sweeps baud on connect and re-sweeps on a noisy line, locking back at the fastest baud that worked. Messages carry an end-to-end CRC-16 over arbitrary-length payloads, independent of the per-frame CRC-8. Built-in throughput counters, auto-sized buffers, thread-safe FreeRTOS stream buffers. Delivery is best-effort under sustained noise — if your sketch needs hard delivery guarantees, layer them on top (an app-level sequence + ack). Optional AutoLinkWeb class adds a WiFi-hosted real-time dashboard (requires WiFi credentials; no extra libraries).
category=Communication
