name=AutoLink
version=5.3.28
author=Developer
maintainer=Developer
sentence=An auto-negotiating UART layer for the ESP32 with ARQ retransmit and best-effort delivery.
paragraph=One-object send()/recv() API with auto-baud negotiation, COBS+CRC8 framing with cobsSeq gap detection, best-effort ARQ (ACK-timeout retransmit up to a bounded retry count, hold-on-gap reorder buffer, staleness cap; a chunk that exhausts its retries is dropped and counted in lostMsgs, not delivered-guaranteed), boundary-preserving CRC16 messages, auto-sized buffers, built-in throughput counters, and thread-safe FreeRTOS stream buffers. Delivery is best-effort under sustained noise — if your sketch needs hard delivery guarantees, layer them on top (an app-level sequence + ack). Optional AutoLinkWeb class adds a WiFi-hosted real-time dashboard (requires WiFi credentials; no extra libraries).
category=Communication
url=https://github.com/Systemsplanet/autolink
architectures=esp32
